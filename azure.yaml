# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: viper
metadata:
  template: viper@1.0.0

# Inherit environment variables from the .env file located at the repository root.
# These values are passed to the infrastructure-as-code templates and container apps.
infra:
  provider: bicep
  path: infra
  module: main

services:
  backend:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile.backend
      context: .
      remoteBuild: true
  frontend:
    project: src/ui
    language: js
    host: containerapp
    docker:
      path: ../../Dockerfile.frontend
      context: ../..
      remoteBuild: true

hooks:
  # Validate that azd environment values are selected before provisioning.
  # Use `azd env set --file .env` to import local values; hooks intentionally
  # avoid sourcing `.env` so stale local files cannot override azd state.
  preprovision:
    posix:
      shell: sh
      run: |
        normalize_env_value() {
          printf '%s' "$1" | tr -d '"' | xargs
        }

        get_env_value() {
          azd env get-value "$1" 2>/dev/null || true
        }

        migrate_legacy_ai_role_assignment() {
          resource_id="$(normalize_env_value "$1")"
          role_name="$2"
          if [ -z "$resource_id" ] || [ -z "$BACKEND_PRINCIPAL_ID" ]; then
            return 0
          fi

          assignments="$(az role assignment list \
            --assignee "$BACKEND_PRINCIPAL_ID" \
            --role "$role_name" \
            --scope "$resource_id" \
            --query '[].{name:name,id:id}' \
            -o tsv)" || return 1

          [ -z "$assignments" ] && return 0
          printf '%s\n' "$assignments" | while IFS="$(printf '\t')" read -r assignment_name assignment_id; do
              [ -z "$assignment_name" ] && continue
              guid_version="$(printf '%s' "$assignment_name" | cut -d '-' -f 3 | cut -c 1 | tr '[:upper:]' '[:lower:]')"
              if [ "$guid_version" = "5" ]; then
                echo "AI RBAC preflight: found existing Bicep-owned $role_name assignment $assignment_name at $resource_id."
              else
                echo "AI RBAC preflight: removing legacy $role_name assignment $assignment_name at $resource_id so Bicep can own it."
                az role assignment delete --ids "$assignment_id" || exit 1
              fi
            done
        }

        azd env get-value AZURE_ENV_NAME >/dev/null
        azd env get-value RESOURCE_GROUP_TAGS >/dev/null 2>&1 || azd env set RESOURCE_GROUP_TAGS '{}'

        RG="$(get_env_value AZURE_RESOURCE_GROUP)"
        BACKEND_APP="$(get_env_value SERVICE_BACKEND_NAME)"
        BACKEND_PRINCIPAL_ID=""
        if [ -n "$RG" ] && [ -n "$BACKEND_APP" ]; then
          BACKEND_PRINCIPAL_ID="$(az containerapp show --resource-group "$RG" --name "$BACKEND_APP" --query identity.principalId -o tsv 2>/dev/null || true)"
        fi
        if [ -n "$BACKEND_PRINCIPAL_ID" ]; then
          migrate_legacy_ai_role_assignment "$(get_env_value AZURE_OPENAI_GPT_VISION_RESOURCE_ID)" "Cognitive Services OpenAI User" || exit 1
          migrate_legacy_ai_role_assignment "$(get_env_value AZURE_SPEECH_RESOURCE_ID)" "Cognitive Services User" || exit 1
        else
          echo "AI RBAC preflight: no existing backend Container App identity found; skipping legacy assignment migration."
        fi
    windows:
      shell: pwsh
      run: |
        function Get-EnvValue([string]$Name) {
          $value = azd env get-value $Name 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) {
            return ""
          }
          return $value.Trim().Trim('"')
        }

        function Move-LegacyAiRoleAssignment([string]$ResourceId, [string]$RoleName) {
          if ([string]::IsNullOrWhiteSpace($ResourceId) -or [string]::IsNullOrWhiteSpace($script:BackendPrincipalId)) {
            return
          }

          $assignmentsJson = az role assignment list `
            --assignee $script:BackendPrincipalId `
            --role $RoleName `
            --scope $ResourceId `
            --query "[].{name:name,id:id}" `
            -o json
          if ($LASTEXITCODE -ne 0) {
            throw "AI RBAC preflight failed while listing $RoleName assignments at $ResourceId."
          }
          $assignments = @($assignmentsJson | ConvertFrom-Json)
          foreach ($assignment in $assignments) {
            if ([string]::IsNullOrWhiteSpace($assignment.name)) {
              continue
            }
            $guidVersion = ""
            if ($assignment.name -match "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-([0-9a-fA-F])") {
              $guidVersion = $Matches[1].ToLowerInvariant()
            }
            if ($guidVersion -eq "5") {
              Write-Host "AI RBAC preflight: found existing Bicep-owned $RoleName assignment $($assignment.name) at $ResourceId."
            } else {
              Write-Host "AI RBAC preflight: removing legacy $RoleName assignment $($assignment.name) at $ResourceId so Bicep can own it."
              az role assignment delete --ids $assignment.id
              if ($LASTEXITCODE -ne 0) {
                throw "AI RBAC preflight failed while deleting legacy $RoleName assignment $($assignment.name) at $ResourceId."
              }
            }
          }
        }

        azd env get-value AZURE_ENV_NAME | Out-Null
        $resourceGroupTags = azd env get-value RESOURCE_GROUP_TAGS 2>$null
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroupTags)) {
          azd env set RESOURCE_GROUP_TAGS '{}'
        }

        $rg = Get-EnvValue "AZURE_RESOURCE_GROUP"
        $backendApp = Get-EnvValue "SERVICE_BACKEND_NAME"
        $script:BackendPrincipalId = ""
        if (-not [string]::IsNullOrWhiteSpace($rg) -and -not [string]::IsNullOrWhiteSpace($backendApp)) {
          $script:BackendPrincipalId = az containerapp show --resource-group $rg --name $backendApp --query identity.principalId -o tsv 2>$null
          if ($LASTEXITCODE -ne 0) {
            $script:BackendPrincipalId = ""
          }
        }
        if (-not [string]::IsNullOrWhiteSpace($script:BackendPrincipalId)) {
          Move-LegacyAiRoleAssignment (Get-EnvValue "AZURE_OPENAI_GPT_VISION_RESOURCE_ID") "Cognitive Services OpenAI User"
          Move-LegacyAiRoleAssignment (Get-EnvValue "AZURE_SPEECH_RESOURCE_ID") "Cognitive Services User"
        } else {
          Write-Host "AI RBAC preflight: no existing backend Container App identity found; skipping legacy assignment migration."
        }

  # Re-assert ACR pull after Container Apps identities and role assignments exist.
  # Bicep also configures the registry so later provisions can preserve real ACR
  # images; this hook remains as an idempotent first-run bootstrap safeguard.
  postprovision:
    posix:
      shell: sh
      run: |
        RG="$(azd env get-value AZURE_RESOURCE_GROUP)"
        ACR="$(azd env get-value AZURE_CONTAINER_REGISTRY_ENDPOINT)"
        BACKEND_APP="$(azd env get-value SERVICE_BACKEND_NAME)"
        FRONTEND_APP="$(azd env get-value SERVICE_FRONTEND_NAME)"
        az containerapp registry set --resource-group "$RG" --name "$BACKEND_APP" --server "$ACR" --identity system
        if [ -n "$FRONTEND_APP" ]; then
          az containerapp registry set --resource-group "$RG" --name "$FRONTEND_APP" --server "$ACR" --identity system
        fi
    windows:
      shell: pwsh
      run: |
        $RG = azd env get-value AZURE_RESOURCE_GROUP
        $ACR = azd env get-value AZURE_CONTAINER_REGISTRY_ENDPOINT
        $BACKEND_APP = azd env get-value SERVICE_BACKEND_NAME
        $FRONTEND_APP = azd env get-value SERVICE_FRONTEND_NAME
        az containerapp registry set --resource-group $RG --name $BACKEND_APP --server $ACR --identity system
        if (-not [string]::IsNullOrWhiteSpace($FRONTEND_APP)) {
          az containerapp registry set --resource-group $RG --name $FRONTEND_APP --server $ACR --identity system
        }

  # Keep selected azd environment available before deployment.
  predeploy:
    posix:
      shell: sh
      run: |
        azd env get-value AZURE_ENV_NAME >/dev/null
    windows:
      shell: pwsh
      run: |
        azd env get-value AZURE_ENV_NAME | Out-Null
